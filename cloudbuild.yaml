steps:
  # 1. Build the Backend Image
  - name: 'gcr.io/cloud-builders/docker'
    args: [
      'build', 
      '-t', 'gcr.io/$PROJECT_ID/api-backend:latest', 
      '-f', 'Dockerfile-backend', 
      '.'
    ]

  # 2. Build the Frontend Image
  - name: 'gcr.io/cloud-builders/docker'
    args: [
      'build', 
      '-t', 'gcr.io/$PROJECT_ID/angular-frontend:latest', 
      '-f', 'Dockerfile-frontend', 
      '.'
    ]

  # 3. Push Backend to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/api-backend:latest']

  # 4. Push Frontend to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/angular-frontend:latest']

# Images to be stored in the Registry
images:
  - 'gcr.io/$PROJECT_ID/api-backend:latest'
  - 'gcr.io/$PROJECT_ID/angular-frontend:latest'

options:
  logging: CLOUD_LOGGING_ONLY
