steps:
  # Build the single combined image
  - name: 'gcr.io/cloud-builders/docker'
    args: [
      'build', 
      '-t', 'gcr.io/$PROJECT_ID/elevate360-app:latest', 
      '.'
    ]

  # Push the image to the registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/elevate360-app:latest']

images:
  - 'gcr.io/$PROJECT_ID/elevate360-app:latest'

options:
  logging: CLOUD_LOGGING_ONLY
